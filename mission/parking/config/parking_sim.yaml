# 주차 조정 파일: 숫자를 수정한 뒤 parking 노드/bringup을 재시작한다.
# bringup.launch.py가 설치된 이 파일을 읽는다. 일반 실행에는 --params-file로 전달한다.
parking_detect_node:
  ros__parameters:
    direction: left  # left=왼쪽 주차, right=오른쪽 주차
    white_ratio: 0.06
    # direction: left는 left.* 배열, right는 right.* 배열을 사용한다.
    # 각 배열은 숫자 6개다. 순서: 0직선 1회전 2직선 3직선 4회전 5직선.
    # distances: 이동 거리 [m, 양수]. 회전 단계의 거리는 0.0.
    # angles_deg: 회전각 [도, 양수]. 직선 단계의 각도는 0.0.
    # linear_speeds: 최대 선속도 [m/s]. 양수=전진, 음수=후진.
    # angular_speeds: 최대 각속도 [rad/s, 양수 크기]. left는 좌회전, right는 우회전.
    # 양쪽 초기값에 현재 사용 중인 YAML 튜닝값을 복사했다. 각 쪽을 별도로 조정한다.

    # 왼쪽 주차의 6단계
    left.distances:      [0.5, 0.0,  0.32, 0.35, 0.0,  0.40]
    left.angles_deg:     [0.0,  89.4, 0.0,  0.0,  87.3, 0.0]
    left.linear_speeds:  [0.2,  0.0,  0.2, -0.2,  0.0,  0.2]
    left.angular_speeds: [0.0,  1.2,  0.0,  0.0,  1.5,  0.0]

    # 오른쪽 주차의 6단계
    right.distances:      [0.55, 0.0,  0.32, 0.28, 0.0,  0.40]
    right.angles_deg:     [0.0,  89.4, 0.0,  0.0,  87.3, 0.0]
    right.linear_speeds:  [0.2,  0.0,  0.2, -0.2,  0.0,  0.2]
    right.angular_speeds: [0.0,  1.2,  0.0,  0.0,  1.5,  0.0]

    # 아래는 양쪽 공통 제어값. 먼저 선택한 쪽의 거리·각도·속도를 조절한다.
    distance_tolerance: 0.01     # 목표 거리 허용 오차 [m]
    angle_tolerance_deg: 1.0    # 목표 회전 허용 오차 [도]
    distance_kp: 1.0            # 남은 거리 → 선속도
    angle_kp: 1.5               # 남은 각도(rad) → 각속도
    heading_kp: 2.0             # 직선 구간의 시작 방향 유지 (0.0이면 끔)
    min_linear_speed: 0.03     # 감속 중 최소 선속도 [m/s]
    min_angular_speed: 0.10    # 감속 중 최소 회전 속도 [rad/s]
    max_heading_angular: 0.4   # 직선 구간 방향 보정 최대 각속도 [rad/s]
    stop_linear_tolerance: 0.01 # 실제 정지 확인 선속도 [m/s]
    stop_angular_tolerance: 0.03 # 실제 정지 확인 각속도 [rad/s]
    odom_timeout: 0.5          # odom이 이 시간 이상 오래되면 HALT [초]
    stop_timeout: 3.0          # 정지 확인 최대 대기 [초]
    # 단계별 최대 시간 [초]. 초과하면 HALT하며 다음 단계로 넘기지 않는다.
    step_timeouts: [10.0, 10.0, 12.0, 12.0, 10.0, 10.0]
