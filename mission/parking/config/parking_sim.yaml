# 원본 주차 수치. 시뮬레이션용 원호/odom 제어/속도 보정은 사용하지 않는다.
# 실행 시 --params-file 또는 기존 launch의 parameters로 전달한다. 변경 후 노드를 재시작한다.
parking_detect_node:
  ros__parameters:
    direction: left
    white_ratio: 0.60
    # 인덱스: 0 후진, 1 회전1, 2 전진, 3 후진, 4 회전2, 5 전진.
    # 선속도 단위 m/s, 각속도 rad/s, 시간 초.
    linear_speeds: [-0.2, 0.0, 0.2, -0.2, 0.0, 0.2]
    angular_speeds: [0.0, 1.2, 0.0, 0.0, 1.5, 0.0]
    durations: [1.0, 1.3, 1.6, 1.6, 0.9, 1.0]
    # 회전1: 1.2 × 1.3 = 1.56rad ≈ 89.4°, 회전2: 1.5 × 0.9 = 1.35rad ≈ 77.3°.
    # 원본처럼 둘 다 direction 방향이며, 실제 각도가 아닌 시간으로 끝난다.
