# 좌회전/우회전 교차로 설정. 숫자를 수정한 뒤 driving 또는 bringup을 재시작한다.
# bringup.launch.py가 이 파일을 읽는다. 초기값은 좌우 모두 기존 교차로 값이다.
driving:
  ros__parameters:
    # 왼쪽: /left 표지 또는 주차 출구의 좌회전 인계 시 적용.
    intersection.left.v_max: 0.30           # 최대 속도 기준 [m/s], 커브에서 추가 감속
    intersection.left.curvature_scale: 0.7  # 곡률 배율. 높이면 목표점 쪽으로 더 강하게 조향
    intersection.left.max_ang: 3.0          # 평활화 전 최대 각속도 [rad/s, 양수 크기]
    intersection.left.v_single: 0.8         # 한쪽 차선만 보일 때 속도 배율 [0.0~1.0]

    # 오른쪽: /right 표지 시 적용. 아래 네 숫자는 왼쪽과 별개다.
    intersection.right.v_max: 0.30
    intersection.right.curvature_scale: 0.7
    intersection.right.max_ang: 3.0
    intersection.right.v_single: 0.8

# 회전 방향은 ROI와 차선 목표점이 결정한다. 오른쪽 값에도 음수를 넣지 않는다.
# 미검출 직진은 공통 pure_pursuit.v_lost를 쓰고, 주차 진입 탐색은 parking.search_*를 쓴다.
